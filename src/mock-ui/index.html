<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twilio Call Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "forest-green": "rgb(34, 197, 94)",
            "app-bg": "rgb(245, 245, 245)",
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
          },
          borderRadius: {
            "xlarge": "40px",
          }
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    :root {
      --bg-color: rgb(245, 245, 245);
      --shadow-light: #ffffff;
      --shadow-dark: #d1d1d1;
      --forest-green: rgb(34, 197, 94);
    }
    body {
      background-color: var(--bg-color);
      color: #334155;
    }
    .neumorphic-flat {
      background: var(--bg-color);
      box-shadow: 10px 10px 20px var(--shadow-dark),
                  -10px -10px 20px var(--shadow-light);
    }
    .neumorphic-inset {
      background: var(--bg-color);
      box-shadow: inset 6px 6px 12px var(--shadow-dark),
                  inset -6px -6px 12px var(--shadow-light);
    }
    .neumorphic-button-forest {
      background: var(--forest-green);
      box-shadow: 6px 6px 16px rgba(34, 197, 94, 0.25),
                  -4px -4px 12px rgba(255, 255, 255, 0.4);
    }
    .neumorphic-button-soft {
      background: var(--bg-color);
      box-shadow: 6px 6px 12px var(--shadow-dark),
                  -6px -6px 12px var(--shadow-light);
    }
    .neumorphic-button-soft:active {
      box-shadow: inset 4px 4px 8px var(--shadow-dark),
                  inset -4px -4px 8px var(--shadow-light);
    }
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
    .status-indicator.idle .status-dot-inner {
      background-color: #94a3b8;
    }
    .status-indicator.idle .status-dot-ping {
      background-color: #94a3b8;
    }
    .status-indicator.idle .status-text {
      color: #64748b;
    }
    .status-indicator.calling .status-dot-inner {
      background-color: #f59e0b;
    }
    .status-indicator.calling .status-dot-ping {
      background-color: #f59e0b;
    }
    .status-indicator.calling .status-text {
      color: #f59e0b;
    }
    .status-indicator.connected .status-dot-inner {
      background-color: var(--forest-green);
    }
    .status-indicator.connected .status-dot-ping {
      background-color: var(--forest-green);
    }
    .status-indicator.connected .status-text {
      color: var(--forest-green);
    }
    .status-indicator.error .status-dot-inner,
    .status-indicator.failed .status-dot-inner {
      background-color: #ef4444;
    }
    .status-indicator.error .status-dot-ping,
    .status-indicator.failed .status-dot-ping {
      background-color: #ef4444;
    }
    .status-indicator.error .status-text,
    .status-indicator.failed .status-text {
      color: #ef4444;
    }
    /* Button icon via pseudo-element to keep text content clean for tests */
    #make-call-btn::before {
      content: "phone_forwarded";
      font-family: "Material Symbols Outlined";
      font-size: 1.5rem;
      margin-right: 0.75rem;
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
  </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex items-center justify-center">
  <div class="max-w-6xl w-full space-y-12">
    <!-- Header -->
    <header class="text-center space-y-3">
      <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight">
        Twilio Call Dashboard
      </h1>
      <p class="subtitle text-forest-green font-semibold text-sm uppercase tracking-[0.2em]">Automation Testing Interface</p>
    </header>

    <div class="grid grid-cols-1 gap-12">
      <!-- Make Call Section -->
      <section class="neumorphic-flat p-8 md:p-12 rounded-xlarge">
        <div class="flex items-center gap-4 mb-10">
          <div class="neumorphic-button-soft w-14 h-14 flex items-center justify-center rounded-2xl text-forest-green">
            <span class="material-symbols-outlined text-3xl">add_call</span>
          </div>
          <h2 class="text-2xl font-bold text-slate-700">Make a Call</h2>
        </div>
        <div class="flex flex-col lg:flex-row gap-8 items-end">
          <div class="flex-grow w-full">
            <label for="phone-input" class="block text-slate-500 font-bold mb-4 ml-2 text-sm uppercase tracking-wider">Phone Number</label>
            <input
              type="tel"
              id="phone-input"
              class="w-full neumorphic-inset border-none rounded-2xl py-5 px-8 text-slate-700 font-semibold placeholder-slate-400 focus:ring-2 focus:ring-forest-green/20 transition-all text-lg"
              placeholder="+15005550006"
              pattern="\+[0-9]{10,15}"
              required
            >
          </div>
          <button id="make-call-btn" class="w-full lg:w-80 neumorphic-button-forest text-white hover:brightness-110 font-bold py-5 px-12 rounded-2xl flex items-center justify-center transition-all active:scale-[0.98] text-lg whitespace-nowrap">Make Call</button>
        </div>
      </section>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
        <!-- Status Section -->
        <section class="neumorphic-flat p-8 rounded-xlarge lg:col-span-1">
          <div class="flex items-center gap-4 mb-8">
            <div class="neumorphic-button-soft w-12 h-12 flex items-center justify-center rounded-2xl text-forest-green">
              <span class="material-symbols-outlined text-2xl">sensors</span>
            </div>
            <h2 class="text-xl font-bold text-slate-700">Current Status</h2>
          </div>
          <div id="status-display" class="neumorphic-inset p-6 rounded-3xl space-y-4">
            <div class="status-indicator idle flex items-center gap-3">
              <span class="status-dot flex h-3 w-3 relative">
                <span class="status-dot-ping animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>
                <span class="status-dot-inner relative inline-flex rounded-full h-3 w-3"></span>
              </span>
              <span class="status-text font-bold text-slate-600 text-lg">Idle</span>
            </div>
            <p id="status-message" class="text-slate-500 text-sm font-medium leading-relaxed">
              Ready to make a call
            </p>
            <p id="call-sid" class="call-sid text-slate-400 text-xs font-mono"></p>
          </div>
        </section>

        <!-- Call History Section -->
        <section class="neumorphic-flat p-8 rounded-xlarge lg:col-span-2">
          <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
              <div class="neumorphic-button-soft w-12 h-12 flex items-center justify-center rounded-2xl text-forest-green">
                <span class="material-symbols-outlined text-2xl">history</span>
              </div>
              <h2 class="text-xl font-bold text-slate-700">Call History</h2>
            </div>
            <button id="refresh-btn" class="neumorphic-button-soft text-slate-500 p-3 rounded-xl transition-all hover:text-forest-green">
              <span class="material-symbols-outlined">refresh</span>
            </button>
          </div>
          <div class="neumorphic-inset rounded-3xl overflow-hidden">
            <div class="overflow-x-auto">
              <table id="history-table" class="w-full text-left border-collapse">
                <thead>
                  <tr class="text-slate-400 border-b border-black/5">
                    <th class="p-5 font-bold text-xs uppercase tracking-widest">Call SID</th>
                    <th class="p-5 font-bold text-xs uppercase tracking-widest">To</th>
                    <th class="p-5 font-bold text-xs uppercase tracking-widest">Status</th>
                    <th class="p-5 font-bold text-xs uppercase tracking-widest">Duration</th>
                    <th class="p-5 font-bold text-xs uppercase tracking-widest text-right">Time</th>
                  </tr>
                </thead>
                <tbody id="history-body">
                  <tr class="empty-state">
                    <td class="py-16 text-center" colspan="5">
                      <div class="flex flex-col items-center gap-3 text-slate-400">
                        <span class="material-symbols-outlined text-5xl opacity-20">phone_disabled</span>
                        <span class="font-semibold text-sm">No calls yet</span>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- Footer -->
    <footer class="flex flex-col items-center justify-center mt-12 space-y-6">
      <div class="flex gap-4">
        <button class="neumorphic-button-soft w-12 h-12 rounded-full flex items-center justify-center text-slate-500 hover:text-forest-green transition-colors">
          <span class="material-symbols-outlined">settings</span>
        </button>
        <button class="neumorphic-button-soft w-12 h-12 rounded-full flex items-center justify-center text-slate-500 hover:text-forest-green transition-colors">
          <span class="material-symbols-outlined">help_outline</span>
        </button>
      </div>
      <p class="text-slate-400 text-xs font-medium tracking-wide uppercase">Twilio Telephony Automation Testing Framework</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
