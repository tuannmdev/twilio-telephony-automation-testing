name: Twilio Telephony Automation Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        working-directory: ./code
        run: npm ci

      - name: Create .env file
        working-directory: ./code
        run: |
          echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env
          echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env
          echo "TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}" >> .env
          echo "TEST_PHONE_TO=${{ secrets.TEST_PHONE_TO }}" >> .env

      - name: Run API tests
        working-directory: ./code
        run: npm run test:api

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: code/test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: code/playwright-report/
          retention-days: 30

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        working-directory: ./code
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./code
        run: npx playwright install --with-deps chromium

      - name: Create .env file
        working-directory: ./code
        run: |
          echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env
          echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env
          echo "TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}" >> .env
          echo "TEST_PHONE_TO=${{ secrets.TEST_PHONE_TO }}" >> .env
          echo "MOCK_SERVER_PORT=3000" >> .env

      - name: Start mock server
        working-directory: ./code
        run: |
          npm run mock-server &
          echo $! > server.pid
          sleep 5

      - name: Wait for server to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:3000/health; do sleep 1; done'

      - name: Run UI tests
        working-directory: ./code
        run: npm run test:ui

      - name: Stop mock server
        if: always()
        working-directory: ./code
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: code/test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: code/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: code/test-results/**/screenshots/
          retention-days: 30

  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        working-directory: ./code
        run: npm ci

      - name: Run TypeScript type check
        working-directory: ./code
        run: npx tsc --noEmit

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests, lint-and-typecheck]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "API Tests: ${{ needs.api-tests.result }}"
          echo "UI Tests: ${{ needs.ui-tests.result }}"
          echo "Lint & Type Check: ${{ needs.lint-and-typecheck.result }}"

      - name: Determine overall status
        run: |
          if [ "${{ needs.api-tests.result }}" == "failure" ] || \
             [ "${{ needs.ui-tests.result }}" == "failure" ] || \
             [ "${{ needs.lint-and-typecheck.result }}" == "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          elif [ "${{ needs.api-tests.result }}" == "success" ] && \
               [ "${{ needs.ui-tests.result }}" == "success" ] && \
               [ "${{ needs.lint-and-typecheck.result }}" == "success" ]; then
            echo "✅ All tests passed"
            exit 0
          else
            echo "⚠️ Tests were cancelled or skipped"
            exit 1
          fi
